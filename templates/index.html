<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 질문 서비스</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>오늘의 질문</h1>

        {% if username %}
            <p>{{ username }}님, 안녕하세요!
                <a href="/logout">로그아웃</a>
            </p>
        {% else %}
            <p>
                <a href="/login">로그인</a> |
                <a href="/signup">회원가입</a>
            </p>
        {% endif %}

        <div class="question-box">
            <p>{{ question }}</p>
        </div>

        <form method="POST" action="/answer">
            <textarea name="answer" placeholder="여기에 답변을 적어보세요"></textarea>
            <br>
            <button type="submit">답변 등록</button>
        </form>

        <h3>답변 목록</h3>
        <ul>
            {% for a in answers %}
                <li>
                    <strong>{{ a.username }}</strong>
                    <span>{{ a.created_at }}</span>
                    <br>
                    {{ a.content }}

                    {% if username == a.username %}
                        <br>
                        <a href="/edit/{{ loop.index0 }}">수정</a>
                        <a href="/delete/{{ loop.index0 }}">삭제</a>
                    {% endif %}
                </li>
            {% endfor %}
        </ul>

        <a href="/new-question">
            <button type="button">다른 질문 보기</button>
        </a>
    </div>
</body>
</html>
